# smplOS critical bundle metadata
#
# This file is read by smplos-update after regular updates complete.
# If BUNDLE_ID differs from the locally applied id, the user is prompted
# to install this package set as an explicit critical-stack update.
#
# PACKAGES accepts plain package names and/or pinned specs like:
#   nvidia=570.153.02-1
#
# NOTE: pinned versions are only reliable if your repos/cache keep them.

BUNDLE_ID="2026.08.04-1"
DESCRIPTION="Fleet stack refresh: linux-lts + nvidia-open-dkms + hyprland 0.56.0-2 + xdg-desktop-portal-hyprland + kernel-modules-hook"
REBOOT_REQUIRED=1

# The bundle serves TWO jobs:
#   1. Pin packages whose ABI is locked across the wider smplOS stack
#      (currently just hyprland + xdg-desktop-portal-hyprland). These are
#      also listed in critical-packages.txt so `pacman -Syu` never bumps
#      them behind our back.
#   2. Ensure smplOS-mandated baseline packages are installed on every host
#      even if the machine was upgraded from an older ISO that predates them
#      (linux-lts, nvidia-open-dkms + utils, kernel-modules-hook). These are
#      NOT pinned — they roll forward via `pacman -Syu` between bundle revs
#      and are only re-asserted here to catch missing installs.
#
# Everything else that used to live here (mesa/lib32-mesa, hyprpaper,
# hypridle, hyprlock, xdg-desktop-portal) has been removed: those roll
# forward cleanly via the normal update pass and having them in the bundle
# just added noise to the "critical update available" prompt.
#
# Hyprland is pinned exactly because hyprland *plugins* are ABI-locked to
# the exact compositor build; xdg-desktop-portal-hyprland tracks the same
# API and must upgrade in lockstep, so it is pinned only by way of also
# being in the ignore list — the bundle re-applies whatever version Arch
# publishes at bundle-cut time, which is presumed compatible with the
# pinned hyprland (verified before each bump).
#
# NVIDIA: nvidia-open-dkms is the officially-supported open-source module
# (Turing+, Ampere, Ada, Blackwell). Legacy Maxwell/Pascal/Volta cards get
# nvidia-580xx-dkms picked at install time (see
# src/shared/installer/config/hardware/nvidia.sh) and are handled per-host,
# not via this bundle.
#
# kernel-modules-hook preserves the running kernel's module tree past
# linux-lts upgrades so overlay/nvidia/dkms modules keep loading until
# reboot.
PACKAGES="linux-lts linux-lts-headers nvidia-open-dkms nvidia-utils lib32-nvidia-utils kernel-modules-hook hyprland=0.56.0-2 xdg-desktop-portal-hyprland"