# smplOS Emergency Recovery Bindings
#
# This file is ALWAYS sourced last in hyprland.conf and is restored automatically
# by smplos-os-update when missing. It provides hardcoded last-resort bindings
# that work even when the main bindings.conf is missing, corrupted, or blank.
#
# These bindings use Ctrl+Alt combinations (no Super) so they work even if the
# Super modifier is being captured or is broken.
#
# DO NOT remove or comment out this file — it is the recovery path for users
# whose system is in a broken state.

# ── Emergency terminal ────────────────────────────────────────────────────────
# Ctrl+Alt+T: open a terminal so the user can run smplos-update to recover
bind = CTRL ALT, T, exec, terminal

# ── Emergency update trigger ──────────────────────────────────────────────────
# Ctrl+Alt+U: launch the smplOS updater to pull fixes from GitHub
bind = CTRL ALT, U, exec, smplos-update --mode full

# ── Emergency config reload ───────────────────────────────────────────────────
# Ctrl+Alt+R: reload Hyprland config (pick up restored files after update)
bind = CTRL ALT, R, exec, hyprctl reload

# ── Emergency screen recovery ─────────────────────────────────────────────────
# Super+Ctrl+D: manually run screen-recover (DPMS off/on cycle + reload).
# Blind-typable fallback if Hyprland 0.56.0+'s upstream DPMS-wake fix ever
# misses. Uses SUPER (not CTRL+ALT like the other emergency binds) because
# in this system's convention CTRL+ALT combinations belong to apps.
# Trade-off: requires the Super modifier to be functional; if you've
# broken Super, use Ctrl+Alt+T to get a terminal and run screen-recover
# manually. Every step logs to ~/.cache/smplos/screen-recover.log.
bind = SUPER CTRL, D, exec, screen-recover

# NOTE: Ctrl+Alt+C is intentionally NOT bound at the compositor level so
# that VS Code (and other apps) receive the key. See ~/.config/Code/User/
# keybindings.json — VS Code binds Ctrl+Alt+C to focus GitHub Copilot Chat
# so the user can jump straight to the chat input and type blindly during
# a black-screen incident (chat input receives keystrokes even when the
# display isn't updating). If Hyprland grabbed the key here, the app-level
# binding would never fire.

# ── Emergency app center ──────────────────────────────────────────────────────
# Ctrl+Alt+A: open App Center so the user can click Update OS without a terminal
bind = CTRL ALT, A, exec, app-center
